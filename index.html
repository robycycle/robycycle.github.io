<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Dedektif Görevi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kareli defter zemini üzerinde solda etkinlik rafı, sağda büyük sahne; sahnenin altında öğretmen paneli ve ileri/geri. */
:root{
  --paper:#f6f8fd; --grid:#dde5f4; --ink:#14213d; --ink-2:#4a5878; --card:#ffffff; --line:#cdd7ec; --edge:#14213d;
  --accent:#d6451f; --on-accent:#ffffff; --hl:#ffd23f; --on-hl:#14213d; --focus:#1b5fd9;
  --good:#17874a; --bad:#cf3338;
  --c1:#d6451f; --c2:#0f7a72; --c3:#2f5fcb; --c4:#7a4cc4; --c5:#a65a00; --on-c:#ffffff;
  --stone:#c3cbe0; --dug:#8e99b8;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --topH:4.5rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1b33; --grid:#1a2a4b; --ink:#eef2fb; --ink-2:#a9b6d3; --card:#172545; --line:#2c3d66; --edge:#8ea2d6;
    --accent:#ff7a50; --on-accent:#14213d; --focus:#ffd23f; --good:#4cd08a; --bad:#ff7378;
    --c1:#ff7a50; --c2:#3cc7bb; --c3:#6e9bff; --c4:#b48cf0; --c5:#f0a640; --on-c:#0f1b33;
    --stone:#34476f; --dug:#1d2c4e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1b33; --grid:#1a2a4b; --ink:#eef2fb; --ink-2:#a9b6d3; --card:#172545; --line:#2c3d66; --edge:#8ea2d6;
  --accent:#ff7a50; --on-accent:#14213d; --focus:#ffd23f; --good:#4cd08a; --bad:#ff7378;
  --c1:#ff7a50; --c2:#3cc7bb; --c3:#6e9bff; --c4:#b48cf0; --c5:#f0a640; --on-c:#0f1b33;
  --stone:#34476f; --dug:#1d2c4e; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.5vw + 11px,21px)}
body{
  margin:0; font-family:var(--font-body); font-size:1rem; line-height:1.45; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding-block:0 3rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
p{margin:0}
.ic{width:1.2em;height:1.2em;flex:none}

/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.6rem 0}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font:800 1.5rem var(--font-display)}
.brand span{font-size:.8rem;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.timer{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.timer .time{font:800 2.1rem/1 var(--font-display);min-width:4.2ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.done .time{color:var(--bad)}
.tbar{flex-basis:100%;height:.35rem;background:var(--line);border-radius:99px;overflow:hidden;order:5}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.utils{display:flex;gap:.4rem;flex-wrap:wrap;order:4;flex-basis:100%}
.sound{font-size:1.1rem;padding:.5em 1.2em}
.sound.ring{animation:ring .6s}
@keyframes ring{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}

/* düğmeler */
.btn{font:700 .95rem var(--font-body);padding:.5em .95em;border-radius:.65rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);
  box-shadow:0 3px 0 var(--edge);cursor:pointer;display:inline-flex;align-items:center;gap:.4em;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--hl);color:var(--on-hl)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.sm{font-size:.8rem;padding:.3em .65em;box-shadow:0 2px 0 var(--edge)}
.btn[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

/* ana düzen */
.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:1.5rem;align-items:start;padding-top:1.2rem}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH) + .8rem);max-height:calc(100vh - var(--topH) - 2rem);overflow:auto;
  display:flex;flex-direction:column;gap:.25rem;padding-right:.2rem}
.rail h2{font:700 .75rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:.9rem 0 .2rem}
.rail h2:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;border-radius:.7rem;border:2px solid transparent;color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem;background:var(--card)}
.nav small{margin-left:auto;color:var(--ink-2);font-weight:700;white-space:nowrap}
.nav .dot{width:.6rem;height:.6rem;border-radius:50%;border:2px solid var(--edge);flex:none}
.nav.seen .dot{background:var(--good);border-color:var(--good)}
.nav[aria-current="page"]{border-color:var(--edge);box-shadow:0 3px 0 var(--edge);background:var(--hl);color:var(--on-hl)}
.nav[aria-current="page"] small{color:var(--on-hl)}
main{min-width:0}
.shead{margin-bottom:1rem}
.hstep{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font:800 .8rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.pill{background:var(--hl);color:var(--on-hl);padding:.15em .7em;border-radius:99px}
h1{font-weight:800;font-size:clamp(1.9rem,3.4vw,3rem);line-height:1.05;margin:.3rem 0 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1.1rem 1.25rem;min-width:0}
.stack{display:flex;flex-direction:column;gap:1rem;min-width:0}
.linkcard{display:block;text-decoration:none;color:inherit;border-color:var(--edge);box-shadow:0 4px 0 var(--edge)}
.linkcard:hover{background:var(--hl);color:var(--on-hl)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.lead{font-size:1.2rem;color:var(--ink-2);font-weight:600}
.big-q{background:var(--ink);color:var(--paper);border-radius:1rem;padding:1rem 1.3rem;font:700 1.4rem/1.25 var(--font-display)}
.big-q small{display:block;font:800 .75rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:.25rem}
.label{font:800 .75rem var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
mark.op{background:var(--hl);color:var(--on-hl);padding:0 .18em;border-radius:.25em}
.mono{font-family:var(--font-mono)}
.key{display:none}
body.key-on .key{display:block}
.keybox{border:3px dashed var(--bad);border-radius:.8rem;padding:.7rem .9rem;background:var(--card)}
.keybox b{color:var(--bad)}

/* oylama */
.claim p.t{font:700 1.3rem/1.3 var(--font-body);margin:.2rem 0 .8rem}
.votes{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem}
.vote{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.55rem .4rem;font:800 .95rem var(--font-body);border-radius:.8rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.vote small{font-weight:700;color:var(--ink-2);font-size:.75rem}
.vote .n{font:800 2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.vote:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.vote.d .n{color:var(--good)} .vote.y .n{color:var(--bad)}
.bar{display:flex;height:.7rem;border-radius:99px;overflow:hidden;background:var(--line);margin-top:.7rem}
.bar i{display:block;height:100%;transition:width .25s}
.bar .d{background:var(--good)} .bar .y{background:var(--bad)} .bar .e{background:var(--ink-2)}
.undo{margin-top:.5rem;font-size:.8rem}

/* tarayıcı - arama motoru */
.fark{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.9rem}
.fark h3{margin:0;font-size:1.35rem;line-height:1.15;text-wrap:balance}
.fcard{border:3px solid var(--c);border-radius:1rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.fcard .tag{align-self:flex-start;background:var(--c);color:var(--on-c);border-radius:999px;padding:.2rem .8rem;font:800 .95rem var(--font-body)}
.fcard .main{font-size:1.15rem;font-weight:800;line-height:1.3;margin:0}
.fcard .names{display:flex;gap:.4rem;flex-wrap:wrap}
.fcard .names span{border:2px solid var(--c);border-radius:.6rem;padding:.15rem .6rem;font-weight:800;font-size:.95rem}
.fcard .does{margin:0;padding-top:.5rem;border-top:2px solid var(--line);font-weight:700}
.fark .exmp{margin:0;background:var(--soft,var(--line));border-radius:.8rem;padding:.6rem .9rem;font-weight:700}
/* motorlar */
.engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem}
.eng{min-height:8.5rem;text-align:left;padding:1rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge);font-family:var(--font-body);display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.eng b{font:800 1.8rem var(--font-display)}
.eng span{font-size:.95rem;font-weight:600}
.eng .hint{font-size:.75rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.eng.back{background:var(--hl);color:var(--on-hl)}
.eng.back .hint{color:var(--on-hl)}
.checks{display:flex;flex-direction:column;gap:.5rem}
.checks label{display:flex;gap:.7rem;align-items:center;font-weight:700;font-size:1.05rem;cursor:pointer;padding:.5rem .7rem;border-radius:.7rem;background:var(--paper);border:2px solid var(--line)}
.checks input{width:1.4rem;height:1.4rem;accent-color:var(--accent);flex:none}
.checks label:has(input:checked){border-color:var(--good)}
.qin{display:flex;gap:.5rem;flex-wrap:wrap}
.qin input{flex:1;min-width:12rem;font:600 1.05rem var(--font-mono);padding:.55em .9em;border-radius:99px;border:2px solid var(--edge);background:var(--card);color:var(--ink)}

/* araçlar */
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab{font:800 1rem var(--font-body);padding:.55em 1.1em;border-radius:99px;border:2px solid var(--c);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--c);color:var(--on-c);box-shadow:0 3px 0 var(--edge)}
.tool-head{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.sym{font:800 2.6rem/1 var(--font-mono);background:var(--c);color:var(--on-c);border-radius:.8rem;padding:.2em .5em;min-width:2.2em;text-align:center}
.tool-head h2{font-size:2rem}
.tool-head p{font-weight:700;color:var(--ink-2);font-size:1.1rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.opt{border:3px solid var(--line);border-radius:1rem;padding:.9rem;background:var(--card);display:flex;flex-direction:column;gap:.7rem;min-width:0}
.opt .num{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:800 1.4rem var(--font-display)}
.opt.good{border-color:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.opt.dim{opacity:.55}
.sbar{display:flex;align-items:center;gap:.6rem;background:var(--paper);border:2px solid var(--edge);border-radius:99px;padding:.6rem 1rem;font:600 1.1rem var(--font-mono);overflow-wrap:anywhere;min-width:0}
.sbar .ic{color:var(--ink-2)}
.result{border-radius:1rem;padding:1rem 1.2rem;border:3px solid var(--good);background:var(--card)}
.result.no{border-color:var(--bad)}
.result h3{font-size:1.5rem}
.rule{display:inline-block;background:var(--hl);color:var(--on-hl);font-weight:800;border-radius:.6rem;padding:.3em .8em}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* eşleştirme */
.mcols{display:grid;grid-template-columns:.8fr 1.4fr 1.2fr;gap:1rem}
.mcol{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.mi{display:flex;gap:.6rem;align-items:center;text-align:left;font:700 1rem var(--font-body);padding:.7rem .8rem;border-radius:.8rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--edge);overflow-wrap:anywhere}
.mi .l{font:800 1.1rem var(--font-display);width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.mi.sel{background:var(--hl);color:var(--on-hl)}
.mi.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card));cursor:default}
.mi.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mi small{display:block;font-weight:800;color:var(--good)}

/* zarflar */
.envs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem}
.env{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1rem .6rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge);font-family:var(--font-body);text-align:center}
.env svg{width:3.2rem;height:2.4rem}
.env b{font:800 1.2rem var(--font-display)}
.env span{font-weight:700;font-size:.85rem;color:var(--ink-2)}
.env[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.env[aria-pressed="true"] span{color:var(--on-hl)}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.9rem;background:var(--card)}
.qrow .sbar{border-width:0;padding:.2rem 0;background:transparent;font-size:1.05rem}
.chip{font:800 .8rem var(--font-body);padding:.25em .8em;border-radius:99px;background:var(--c);color:var(--on-c);white-space:nowrap}
.claimbox{font:800 1.5rem/1.25 var(--font-display);padding:1rem 1.2rem;border-radius:1rem;background:var(--ink);color:var(--paper)}

/* defter haritası */
.defter{border:2px solid var(--edge);border-radius:.9rem;background:var(--card);overflow:hidden}
.defter-h{font:800 .8rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;padding:.5rem .9rem;background:var(--ink);color:var(--paper)}
.kutu{display:flex;gap:.7rem;align-items:center;padding:.45rem .9rem;border-top:1px solid var(--line);font-weight:700}
.kutu b{font:800 1.1rem var(--font-display);width:1.6em;height:1.6em;border-radius:.4em;border:2px solid var(--edge);display:grid;place-items:center;flex:none}
.kutu.on{background:var(--hl);color:var(--on-hl)}
.kutu.on b{background:var(--on-hl);color:var(--hl);border-color:var(--on-hl)}

/* dedektif sorular */
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.qc{min-height:9rem;text-align:left;padding:1rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge);font-family:var(--font-body);display:flex;flex-direction:column;gap:.4rem;justify-content:center}
.qc b{font:800 2rem var(--font-display)}
.qc span{font-weight:700;font-size:1.05rem}
.qc.closed{background:var(--ink);color:var(--paper);align-items:center;text-align:center}
.qc.closed b{font-size:3rem;color:var(--hl)}
.qc.open b{color:var(--c)}

/* canavar */
.arena{display:grid;grid-template-columns:minmax(12rem,16rem) minmax(0,1fr);gap:1.2rem;align-items:start}
.monster{width:100%;max-width:16rem;display:block}
.monster .x{display:none}
.monster.dead .eye,.monster.dead .brow{display:none}
.monster.dead .x{display:block}
.monster.hit{animation:shake .4s}
.hp{display:flex;gap:.4rem;margin:.4rem 0}
.hp i{flex:1;height:.9rem;border-radius:99px;background:var(--bad)}
.hp i.off{background:var(--line)}
.news{font:600 1.35rem/1.35 var(--font-body);padding:1.1rem 1.3rem;border-radius:1rem;background:var(--paper);border:3px solid var(--edge);position:relative}
.news.fake-style{font-weight:800}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.meta span{font:800 .8rem var(--font-body);padding:.2em .7em;border-radius:99px;border:2px solid var(--line);background:var(--card)}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.decide .btn{justify-content:center;font-size:1.4rem;padding:.7em}
.stamp{display:inline-block;border:5px solid;padding:.05em .45em;font:800 2.2rem var(--font-display);transform:rotate(-7deg);letter-spacing:.06em;border-radius:.3em}
.stamp.good{color:var(--good)} .stamp.bad{color:var(--bad)}

/* kontrol listeleri */
.todo{display:flex;flex-direction:column;gap:.5rem}
.todo label{display:flex;gap:.8rem;align-items:center;font:700 1.15rem var(--font-body);padding:.7rem .9rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);cursor:pointer}
.todo input{width:1.5rem;height:1.5rem;accent-color:var(--accent);flex:none}
.todo label:has(input:checked){border-color:var(--good);text-decoration:line-through;text-decoration-color:var(--good)}
.prog{height:.7rem;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .25s}
.poster{border:3px solid var(--edge);border-radius:1rem;background:var(--card);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
.poster h3{font-size:1.8rem;line-height:1.1}
.urlbig{border:3px solid var(--edge);border-radius:1rem;background:var(--hl);color:var(--on-hl);padding:1rem 1.3rem;box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;gap:.2rem;min-width:0}
.urlbig .label{color:var(--on-hl)}
.urlbig b{font:800 clamp(2.2rem,6vw,4.6rem)/1.05 var(--font-display);overflow-wrap:anywhere}
.poster ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.3rem;font-weight:700}
.picbox{border:3px dashed var(--line);border-radius:.8rem;min-height:4rem;display:grid;place-items:center;color:var(--ink-2);font-weight:800;font-size:.85rem}
.starters{display:flex;flex-wrap:wrap;gap:.5rem}
.starters .btn{font-weight:700}
.techs{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem}
.rozet{display:flex;gap:1rem;flex-wrap:wrap}
.rozet div{flex:1;min-width:9rem;text-align:center;padding:1rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card)}
.rozet svg{width:4rem;height:4rem}
.rozet b{display:block;font:800 1.2rem var(--font-display)}
.rozet span{font-weight:700;color:var(--ink-2)}

/* öğretmen paneli, sayfalama */
.teach{margin-top:1.4rem}
.teach summary{cursor:pointer;font:800 1rem var(--font-display);list-style:none;display:flex;align-items:center;gap:.5rem}
.teach summary::before{content:"▸";transition:transform .15s}
.teach[open] summary::before{transform:rotate(90deg)}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;margin-top:.8rem}
.tcols h3{font-size:1rem;margin-bottom:.3rem}
.tcols ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.3rem}
.tcols .kaz{grid-column:1/-1;font-size:.85rem;color:var(--ink-2);font-weight:700}

  var btns=opts.map(function(o){return '<button class="vote '+o[0]+'" type="button" data-vote="'+id+':'+o[0]+'"><span class="n" data-count="'+id+':'+o[0]+'">0</span>'+esc(o[1])+'<small>'+esc(o[2])+'</small></button>'}).join("");

function paintVotes(root){
  Object.keys(S.votes).forEach(function(id){
    var v=S.votes[id],tot=0,k;for(k in v)tot+=v[k];
    for(k in v){
      var c=$('[data-count="'+id+':'+k+'"]',root);if(c)c.textContent=v[k];
      var s=$('[data-seg="'+id+':'+k+'"]',root);if(s)s.style.width=(tot?v[k]/tot*100:0)+"%";
    }
  });
}
function bindVotes(root){
  if(!root._vb){
    root._vb=1;
    root.addEventListener("click",function(e){
      var b=e.target.closest("[data-vote]");
      if(b){var p=b.dataset.vote.split(":");S.votes[p[0]][p[1]]++;S.hist.push(b.dataset.vote);saveVotes();paintVotes(root);return}
      var u=e.target.closest("[data-undo]");
      if(u){for(var i=S.hist.length-1;i>=0;i--){if(S.hist[i].split(":")[0]===u.dataset.undo){var q=S.hist.splice(i,1)[0].split(":");S.votes[q[0]][q[1]]--;saveVotes();paintVotes(root);break}}}
    });
  }
  paintVotes(root);
}

}

  $("#t-go").textContent=T.run?"Duraklat":(T.left<T.total&&T.left>0?"Devam":"Başlat");
  $("#timer").classList.toggle("done",T.total>0&&T.left===0);
}
function stopT(){T.run=false;clearInterval(T.iv);T.iv=null}

function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    T.ctx=T.ctx||new C();
    [0,.35,.7].forEach(function(d){var o=T.ctx.createOscillator(),g=T.ctx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(T.ctx.destination);o.start(T.ctx.currentTime+d);o.stop(T.ctx.currentTime+d+.2)});
  }catch(e){}
}
function tick(){
  T.left=Math.max(0,Math.round((T.end-Date.now())/1000));paintTimer();
  if(T.left<=0){stopT();paintTimer();beep();toast("Süre doldu")}
}
$("#t-go").addEventListener("click",function(){
  if(T.run){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));stopT();paintTimer();return}
  if(T.left<=0)T.left=T.total;
  try{var C=window.AudioContext||window.webkitAudioContext;if(C&&!T.ctx)T.ctx=new C()}catch(e){}
  T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(tick,250);paintTimer();
});
$("#t-plus").addEventListener("click",function(){T.left+=60;T.total=Math.max(T.total,T.left);if(T.run)T.end+=60000;paintTimer()});

var SND={ctx:null,bag:[],cur:-1,left:0};
function actx(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    SND.ctx=SND.ctx||T.ctx||new C();T.ctx=SND.ctx;
    if(SND.ctx.state==="suspended")SND.ctx.resume();
    return SND.ctx;
  }catch(e){return null}
}
function tone(c,t,o){
  var osc=c.createOscillator(),g=c.createGain(),dur=o.dur||.2,peak=o.g||.2;
  osc.type=o.type||"sine";osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);
  if(o.filter){var f=c.createBiquadFilter();f.type=o.filter[0];f.frequency.value=o.filter[1];f.Q.value=o.filter[2]||1;g.connect(f);f.connect(c.destination)}
  else g.connect(c.destination);
  osc.start(t);osc.stop(t+dur+.05);
}
var SOUNDS=[
  function zil(c,t){for(var i=0;i<14;i++)tone(c,t+i*.09,{f:i%2?1500:1250,dur:.07,g:.3})},
  function bip(c,t){[0,.28,.56].forEach(function(d){tone(c,t+d,{f:880,type:"square",dur:.16,g:.12})})},
  function kus(c,t){for(var i=0;i<6;i++)tone(c,t+i*.15,{f:2200+Math.random()*500,f2:3400+Math.random()*600,dur:.11,g:.2})},
  function ordek(c,t){[0,.34,.9,1.24].forEach(function(d){tone(c,t+d,{f:420,f2:260,type:"sawtooth",dur:.24,g:.25,filter:["bandpass",1000,2]})})},
  function kurbaga(c,t){[0,.9].forEach(function(b){for(var i=0;i<8;i++)tone(c,t+b+i*.075,{f:150,f2:110,type:"sawtooth",dur:.06,g:.35,filter:["lowpass",700,1]})})},
  function gong(c,t){[[196,2.2,.3],[392,1.6,.18],[588,1.1,.1],[784,.8,.06]].forEach(function(p){tone(c,t,{f:p[0],dur:p[1],g:p[2]})})},
  function fil(c,t){[0,1.3].forEach(function(d){tone(c,t+d,{f:260,f2:760,type:"sawtooth",dur:.45,g:.22,filter:["bandpass",1100,1.2]});tone(c,t+d,{f:266,f2:772,type:"square",dur:.45,g:.07,filter:["bandpass",1500,1]});tone(c,t+d+.45,{f:760,f2:520,type:"sawtooth",dur:.45,g:.2,filter:["bandpass",1100,1.2]})})}
];
function nextSound(){
  if(!SND.bag.length){
    var a=[];for(var i=0;i<SOUNDS.length;i++)if(i!==SND.cur)a.push(i);
    for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),x=a[k];a[k]=a[j];a[j]=x}
    SND.bag=a;
  }
  SND.cur=SND.bag.pop();SND.left=2+Math.floor(Math.random()*2);
}
function playAttention(){
  var c=actx();if(!c){toast("Ses bu görünümde açılamadı");return}
  if(SND.left<=0)nextSound();
  SND.left--;
  try{SOUNDS[SND.cur](c,c.currentTime+.02)}catch(e){}
  var b=$("#u-snd");b.classList.remove("ring");void b.offsetWidth;b.classList.add("ring");
}

  try{
    if(document.fullscreenElement){document.exitFullscreen()}
    else{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){toast("Bu görünümde tam ekran açılamadı")})}
  }catch(e){toast("Bu görünümde tam ekran açılamadı")}
};
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Escape"){closeLayer();return}
  var i=ACT.indexOf(cur);
  if(e.key==="ArrowRight"&&ACT[i+1])go(ACT[i+1].id);
  else if(e.key==="ArrowLeft"&&ACT[i-1])go(ACT[i-1].id);
  else if(e.key==="d"||e.key==="D")attention();
  else if(e.key==="s"||e.key==="S")playAttention();
  else if(e.key==="k"||e.key==="K")$("#u-key").click();
});

try{localStorage.removeItem("dg:votes")}catch(e){}
buildRail();
show(location.hash.slice(1)||"hazirlik");
measure();
})();
</script>
